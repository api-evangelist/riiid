name: Riiid
kind: company
description: Riiid (now operating as Socra AI) is an AI education technology company
  whose proprietary deep-knowledge-tracing and score-prediction models power adaptive
  learning. Its consumer product Santa (AI TOEIC / TOEFL test prep) and its R.Inside
  AI-as-a-Service offering bring real-time student modeling to partners. Riiid does
  not publish a public, self-serve developer API; its AI is delivered through B2B
  partner integrations and packaged products.
