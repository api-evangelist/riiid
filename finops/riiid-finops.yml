meters:
- name: santa_subscription
  description: Consumer Santa app subscription billed through the mobile app stores; varies by region and plan.
  unit: subscription
  aggregation: count
  dimensions:
  - account
  - region
  - plan
- name: partner_contract
  description: B2B / R.Inside (AIaaS) partner agreement billed under negotiated, contract-based terms. Not public.
  unit: contract
  aggregation: count
  dimensions:
  - partner
principles:
- name: Visibility
  description: No public API usage exports exist; track Santa subscription receipts via the app stores and partner invoices via contract reporting.
- name: Allocation
  description: Allocate consumer subscription and partner-contract costs to the owning team or program rather than per-API-key usage.
- name: Optimization
  description: Optimize at the contract level (commitment terms, seat counts) since there is no usage-metered public API to tune.
- name: Accountability
  description: Assign an owner for each partner contract and review negotiated terms against budget periodically.
