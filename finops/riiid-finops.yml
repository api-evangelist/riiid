description: >-
  FinOps view of Riiid (Socra AI) spend. Riiid does not offer a public,
  usage-metered developer API, so there are no per-request or per-token public
  meters to manage. Cost exposure falls into two non-API categories: consumer
  Santa app subscriptions (billed through the Apple App Store / Google Play) and
  sales-led B2B / R.Inside (AIaaS) partner contracts (negotiated flat or
  commitment-based fees). Meters below are descriptive placeholders, not
  reconciled public billing dimensions.
notes: >-
  No public API billing data exists. Consumer subscription costs are managed in
  the mobile app stores; partner costs are governed by private contracts via
  partnership@socra.ai. Reconciled is false.
